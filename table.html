<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f7f7;
            color: #222;
        }
        h1 {
            text-align: center;
            color: rgb(42, 126, 126);
            margin-top: 35px;
            margin-bottom: 25px;
        }
        table {
            width: 650px;
            max-width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }
        td {
            border: 1px solid #b8caca;
            padding: 14px;
        }
        td:first-child {
            width: 35%;
            font-weight: bold;
            background-color: #eef6f6;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: rgb(42, 126, 126);
        }
        input[type="radio"],
        input[type="checkbox"],
        input[type="color"],
        input[type="range"] {
            width: auto;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .options label {
            font-weight: normal;
        }
        .buttons {
            text-align: center;
        }
        button {
            padding: 10px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit {
            background-color: black;
            color: aqua;
        }
        .reset {
            background-color: #eeeeee;
            color: black;
        }
        button:hover {
            opacity: 0.8;
        }
        .note {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
        @media (max-width: 700px) {
            table {
                width: 95%;
            }
            td {
                display: block;
                width: 100% !important;
            }
            td:first-child {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="">
        <table>
            <!-- Personal Information -->
            <tr>
                <td>
                    <label for="fullname">Full Name:</label>
                </td>
                <td>
                    <input type="text" id="fullname" name="fullname" 
                        placeholder="Enter your full name" 
                        required
                        autofocus
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email:</label>
                </td>
                <td>
                    <input  type="email"  id="email" name="email" placeholder="example@email.com" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Password:</label>
                </td>
                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{6,}"
                        title="Password must contain at least one uppercase letter, one lowercase letter, one number and at least 6 characters."
                        required
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <label for="age">Age:</label>
                </td>
                <td>
                    <input type="number" id="age" name="age" min="17" max="30" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label>Gender:</label>
                </td>
                <td>
                    <div class="options">
                        <label>
                            <input type="radio" name="gender" value="male">Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="female">Female
                        </label>
                        <label>
                            <input type="radio" name="gender" value="other">Other
                        </label>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dob">Date of Birth:</label>
                </td>
                <td>
                    <input type="date" id="dob" name="dob">
                </td>
            </tr>
            <!-- Contact Information -->
            <tr>
                <td>
                    <label for="mobile">Mobile Number:</label>
                </td>
                <td>
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        pattern="[0-9]{10}"
                        placeholder="10 digit mobile number"
                        title="Enter a 10-digit mobile number"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <label for="city">City:</label>
                </td>
                <td>
                    <select id="city" name="city">
                        <option value=""> Select City </option>
                        <option value="kochi"> Kochi </option>
                        <option value="bangalore"> Bangalore </option>
                        <option value="hyderabad"> Hyderabad </option>
                        <option value="mumbai"> Mumbai </option>
                        <option value="chennai"> Chennai </option>
                        <option value="delhi"> Delhi </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address">Address:</label>
                </td>
                <td>
                    <textarea id="address" name="address" rows="4" placeholder="Enter your complete address"></textarea>
                </td>
            </tr>
            <!-- Academic Information -->
            <tr>
                <td>
                    <label for="college">College / Institution:</label>
                </td>
                <td>
                    <input type="text" id="college" name="college" placeholder="Enter college name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="course">Course:</label>
                </td>
                <td>
                    <select id="course" name="course">
                        <option value=""> Select Cours </option>
                        <option value="btech"> B.Tec </option>
                        <option value="bca"> BC </option>
                        <option value="bsc"> B.S </option>
                        <option value="mca"> MC </option>
                        <option value="mtech"> M.Tec </option>
                        <option value="other"> Othe </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="department">Department:</label>
                </td>
                <td>
                    <select id="department" name="department">
                        <option value="">  Select Departmen </option>
                        <option value="cse"> Computer Science & Engineerin </option>
                        <option value="ece"> Electronics & Communicatio </option>
                        <option value="eee"> Electrical & Electronic </option>
                        <option value="me"> Mechanical Engineerin </option>
                        <option value="ce"> Civil Engineerin </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="rollno">Roll Number:</label>
                </td>
                <td>
                    <input type="text" id="rollno" name="rollno" placeholder="Enter roll number">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="semester">Current Semester:</label>
                </td>
                <td>
                    <select id="semester" name="semester">
                        <option value=""> Select Semeste </option>
                        <option value="1"> Semester  </option>
                        <option value="2"> Semester  </option>
                        <option value="3"> Semester  </option>
                        <option value="4"> Semester  </option>
                        <option value="5"> Semester  </option>
                        <option value="6"> Semester  </option>
                        <option value="7"> Semester  </option>
                        <option value="8"> Semester  </option>
                    </select>
                </td>
            </tr>
            <!-- Skills -->
            <tr>
                <td>
                    <label>Technical Skills:</label>
                </td>
                <td>
                    <div class="options">
                        <label>
                            <input type="checkbox" name="skills" value="html">HTML
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="css">CSS
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="javascript">JavaScript
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="python">Python
                        </label>
                        <label>
                            <input type="checkbox" name="skills" value="sql">SQL
                        </label>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="skillrange">Skill Level:</label>
                </td>
                <td>
                    <input type="range" id="skillrange" name="skillrange" min="0" max="100" value="50">
                </td>
            </tr>
            <!-- Upload -->
            <tr>
                <td>
                    <label for="photo">Upload Photo:</label>
                </td>
                <td>
                    <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png">
                    <p class="note"> JPG, JPEG or PNG format </p>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="resume">Upload Resume:</label>
                </td>
                <td>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                    <p class="note"> PDF, DOC or DOCX format </p>
                </td>
            </tr>
            <!-- Extra Information -->
            <tr>
                <td>
                    <label for="color">Favourite Color:</label>
                </td>
                <td>
                    <input type="color" id="color" name="color">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="portfolio">Portfolio Website: </label>
                </td>
                <td>
                    <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
                </td>
            </tr>
            <!-- Confirmation -->
            <tr>
                <td colspan="2">
                    <label>
                        <input type="checkbox" name="agreement" required>
                        I confirm that all the information provided is correct.
                    </label>
                </td>
            </tr>
            <!-- Buttons -->
            <tr>
                <td colspan="2" class="buttons">
                    <button type="submit" class="submit"> Register </button>
                    &nbsp;&nbsp;
                    <button type="reset" class="reset"> Reset </button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>

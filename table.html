<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <style>
        h1{
            text-align: center;
            color: rgb(83, 196, 196);
        }
        button{
            text-align: center;
            background-color: black;
            color: aqua;
        }
        table{
            text-align: center;
            height: 600px;
            width: 500px;
            border-collapse: collapse;
            
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <table border="2" align="center" >
        <tr>
            <td><label for="">Full Name: </label></td>
            <td><input type="text"></td>
        </tr>
        
        <tr>
            <td><label for="">Password: </label></td>
            <td><input type="password"></td>
        </tr>
        
        <tr>
            <td><label for="">Mail: </label></td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td><label for="">Age: </label></td>
            <td><input type="number"></td>
        </tr>
        <tr>
            <td><label for="">Mobile Number: </label></td>
            <td><input type="tele"></td>
        </tr>
        <tr>
            <td><label for="">Date of Birth: </label></td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td><label for="">Interview date & time: </label></td>
            <td><input type="datetime-local"></td>
        </tr>
        <tr>
            <td><label for="">Joining month: </label></td>
            <td><input type="month"></td>
        </tr>
        <tr>
            <td><label for="">Joining week: </label></td>
            <td><input type="week"></td>
        </tr>
        <tr>
            <td><label for="">Upload Resume: </label></td>
            <td><input type="file"></td>
        </tr>
        <tr>
            <td><label for="">Portfolio Website: </label></td>
            <td><input type="url"></td>
        </tr>
        <tr>
            <td><label for="">Favourite Color: </label></td>
            <td><input type="color"></td>
        </tr>
        <tr>
            <td><label for="">Search Course: </label></td>
            <td><input type="search"></td>
        </tr>
        <tr>
            <td><label for="">Gender: </label></td>
            <td>
                <input type="radio" name="h">Male
                <input type="radio" name="h">Female
                <input type="radio" name="h">Others
            </td>
        </tr>
        <tr>
            <td><label for="">Skills: </label></td>
            <td>
                <input type="checkbox">HTML
                <input type="checkbox">CSS
                <input type="checkbox">Javascript
                <input type="checkbox">React
            </td>
        </tr>
        <tr>
            <td><label for="">Skill Range: </label></td>
            <td><input type="range"></td>
        </tr>
        <tr>
            <td><label for="">Address: </label></td>
            <td><textarea cols="30" rows="5"></textarea></td>
        </tr>

        <tr>
            <td colspan="2"><button>Submit</button></td>
        </tr>

    </table>
    <br><br>

    
</body>
</html>

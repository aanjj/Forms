<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1>
    <form action="">
        <label for="">Full Name: </label>
        <br><br>
        <input type="text" required autofocus placeholder="Enter name">
        <br><br>

        <label for="">Email: </label>
        <br><br>
        <input type="email">
        <br><br>

        <label for="">Password: </label>
        <br><br>
        <input type="password" pattern="(?=*[A-Z])(?=*[a-z])(?=*[0-9]).{6}">
        <br><br>

        <label for="">Age: </label>
        <br><br>
        <input type="number" min="17" max="22">
        <br><br>

        <label for="">Gender: </label>
        <br><br>
        <input type="radio" name="h">Male
        <input type="radio" name="h">Female
        <input type="radio" name="h">Others
        <br><br>

        <label for="">Date of Birth: </label>
        <br><br>
        <input type="date">
        <br><br>

        <label for="">Mobile Number: </label>
        <br><br>
        <input type="tele" pattern="[0-9]{10}">
        <br><br>

        <label for="">City: </label>
        <br><br>
        <select>
            <option value=""></option>
            <option value="">Kochi</option>
            <option value="">Banglore</option>
            <option value="">Hyderabad</option>
            <option value="">Mumbai</option>
        </select>
        <br><br>

        <label for="">Skills: </label>
        <br><br>
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">Javascript
        <br><br>

        <label for="">Upload Photo: </label>
        <br><br>
        <input type="file">
        <br><br>

        <label for="">Address: </label>
        <br><br>
        <textarea cols="30" rows="5"></textarea>
        <br><br>
        
        <button style="background-color: blue; color: antiquewhite;">Submit</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <button style="background-color: antiquewhite; color:black;">Reset</button>
    </form>
</body>
</html>

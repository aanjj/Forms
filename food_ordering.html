<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order</title>
</head>
<body>
    <h1 style="text-align: center;">Food Ordering Form</h1>
    <form>
        <label>Customer Name: </label>
        <br><br>
        <input type="text" value="Anjana" autofocus>
        <br><br>

        <label>Restaurant: </label>
        <br><br>
        <select>
            <option value=""></option>
            <option value="">Indian</option>
            <option value="">Chinese</option>
            <option value="">Arabian</option>
        </select>
        <br><br>

        <label for="">Food Items: </label>
        <br><br>
        <input type="checkbox">Biryani
        <input type="checkbox">Fried Rice
        <input type="checkbox">Mnadi
        <input type="checkbox">Noodles
        <br><br>

        <label for="">Spice Level: </label>
        <input type="range">
        <br><br>

        <label for="">Delivery time: </label>
        <br><br>
        <input type="time">
        <br><br>

        <label for="">Address: </label>
        <br><br>
        <textarea cols="30" rows="5">Type your address here...</textarea>
        <br><br>

        <label>Payment Method: </label>
        <br><br>
        <input type="radio">UPI
        <input type="radio">Card
        <input type="radio">Cash
        <br><br>

        <label>Coupon Code: </label>
        <br><br>
        <input type="text" value="SAVE50">
        <br><br>

        <button style="color: wheat; background-color: green;">Place Order</button>
    </form>
</body>
</html>

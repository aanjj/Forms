<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Form</title>
</head>
<body>
    <h1 style="text-align: center;">Job Application Form</h1>
    <form action="">
        <label for="">Name: </label>
        <br><br>
        <input type="text" value="Anjana" required autofocus>
        <br><br>

        <label for="">Email: </label>
        <br><br>
        <input type="email" value="anj12@gmail.com">
        <br><br>

        <label for="">Resume: </label>
        <br><br>
        <input type="file" required>
        <br><br>

        <label for="">Experience(Years): </label>
        <br><br>
        <input type="number" value="1" min="1">
        <br><br>

        <label for="">Portfoliyo URL: </label>
        <br><br>
        <input type="url">
        <br><br>

        <label for="">Preffered Shift: </label>
        <br><br>
        <input type="radio" name="h">Morning
        <input type="radio" name="h">Evening
        <br><br>

        <label for="">Expected Salary(&#8377;): </label>
        <br><br>
        <input type="number" value="20000" step="5000">
        <br><br>

        <label for="">Available Date: </label>
        <br><br>
        <input type="date">
        <br><br>

        <label for="">Skills: </label>
        <br><br>
        <select>
            <option value=""></option>
            <option value="">HTML</option>
            <option value="">CSS</option>
            <option value="">Javascript</option>
        </select>
        <br><br>

        <label for="">Comments: </label>
        <br><br>
        <textarea cols="30" rows="5">Ready to Join</textarea>
        <br><br>
        
        <button style="background-color: blue; color: antiquewhite;">Submit</button>

    </form>
</body>
</html>
